# Instalado em /etc/ssh/sshd_config.d/99-bb-hardening.conf por 00-hardening.sh.
# Somente chave pública; sem root; sem encaminhamentos além do túnel local
# opcional (AllowTcpForwarding local) usado para VNC/CDP via `ssh -L`.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
# __BB_ALLOW_USERS__ é substituído pelo script (admin atual + hunter).
AllowUsers __BB_ALLOW_USERS__
